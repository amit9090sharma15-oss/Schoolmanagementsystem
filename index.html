<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>School Portal</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap">
<style>
/* App shell: deep navy sidebar + light workspace. Each role gets its own pages. Blue is the only accent; green/amber/red mean status only. */
:root{
  --ink:#0F1B33; --ink-2:#17264A; --ink-fg:#C9D3E8; --ink-muted:#7F8DAE;
  --bg:#F4F6FA; --surface:#FFFFFF; --fg:#0F1B33; --muted:#5E6B85; --line:#E3E8F0; --line-2:#EEF1F6;
  --accent:#2563EB; --accent-2:#1D4ED8; --accent-soft:#E8EFFE; --accent-fg:#FFFFFF;
  --good:#12803F; --good-soft:#DCF5E5; --warn:#A15C00; --warn-soft:#FDEFD0; --bad:#C0291F; --bad-soft:#FBE3E0;
  --shadow:0 1px 2px rgba(15,27,51,.05),0 4px 14px rgba(15,27,51,.05);
  --avbg:91%; --avfg:28%;
  --font-body:'Inter',system-ui,'Segoe UI',sans-serif; --font-head:'Manrope','Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0B1220; --surface:#121B2E; --fg:#E8EDF7; --muted:#95A3BD; --line:#223049; --line-2:#1A263B;
  --accent:#6E9BFF; --accent-2:#8DB0FF; --accent-soft:#1B2B52; --accent-fg:#0B1220;
  --good:#5FD18A; --good-soft:#12301F; --warn:#F2B84B; --warn-soft:#3A2C10; --bad:#FF8F86; --bad-soft:#3E1B19;
  --shadow:0 1px 2px rgba(0,0,0,.3);--avbg:26%;--avfg:80%;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--font-head);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:24px;font-weight:800} h2{font-size:16px;font-weight:700} h3{font-size:14px;font-weight:700}
button{font-family:inherit}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* shell */
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--ink);color:var(--ink-fg);display:flex;flex-direction:column;padding:18px 14px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 18px}
.logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,#3B7BFF,#1D4ED8);display:grid;place-items:center;color:#fff;flex:none}
.brand b{display:block;font:800 15px var(--font-head);color:#fff;letter-spacing:-.01em;line-height:1.2}
.brand small{color:var(--ink-muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.nav .cap{font:600 11px var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-muted);padding:10px 10px 6px}
.nav button{display:flex;gap:11px;align-items:center;border:0;background:none;color:var(--ink-fg);font:500 14px var(--font-body);padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left}
.nav button:hover{background:var(--ink-2);color:#fff}
.nav button[aria-current="page"]{background:var(--accent);color:#fff}
.me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px 8px 4px;border-top:1px solid #243257}
.me .t{min-width:0;flex:1}
.me b{display:block;color:#fff;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--ink-muted);font-size:12px}
.me button{border:0;background:var(--ink-2);color:var(--ink-fg);width:34px;height:34px;border-radius:9px;cursor:pointer;display:grid;place-items:center}
.me button:hover{color:#fff}
.main{min-width:0;padding:26px 32px 56px;max-width:1180px;width:100%}
.head{display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:space-between;align-items:flex-end;margin-bottom:22px}
.head p{margin:4px 0 0;color:var(--muted)}

/* surfaces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px;min-width:0}
.card>.ch{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:space-between;align-items:center;margin-bottom:14px}
.ch p{margin:2px 0 0;color:var(--muted);font-size:13px}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:16px 18px;display:flex;gap:14px;align-items:center}
.stat .ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}
.stat .ic.good{background:var(--good-soft);color:var(--good)} .stat .ic.warn{background:var(--warn-soft);color:var(--warn)} .stat .ic.bad{background:var(--bad-soft);color:var(--bad)}
.stat b{display:block;font:800 26px var(--font-head);line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:13px}
.muted{color:var(--muted)} .sm{font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sp{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:18px}

/* controls */
label.f{display:flex;flex-direction:column;gap:5px;font:500 12.5px var(--font-body);color:var(--muted);min-width:0}
select,input,textarea{font:400 14px var(--font-body);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:9px 11px;min-width:0}
input[type=checkbox]{padding:0}
select:hover,input:hover,textarea:hover{border-color:#B7C2D6}
textarea{resize:vertical;min-height:76px;width:100%}
.btn{display:inline-flex;gap:7px;align-items:center;font:600 13.5px var(--font-body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:9px;padding:9px 14px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{background:var(--accent-2);color:var(--accent-fg)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.form{display:grid;gap:12px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.form.flat{margin:0;padding:0;border:0}
.search{position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.search input{padding-left:34px;width:260px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--surface);color:var(--muted);font:500 13px var(--font-body);padding:6px 13px;border-radius:99px;cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}

/* data display */
.pill{display:inline-flex;align-items:center;gap:5px;font:600 12px var(--font-body);padding:3px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.n{background:var(--line-2);color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font:700 13px var(--font-head);flex:none;background:hsl(var(--h) 65% var(--avbg));color:hsl(var(--h) 55% var(--avfg))}
.av.lg{width:64px;height:64px;font-size:22px}
.av.sm{width:30px;height:30px;font-size:11.5px}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line-2)}
.li:first-child{border-top:0;padding-top:0}
.li .w{min-width:0;flex:1}
.li .w b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.seg{display:inline-flex;background:var(--line-2);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:none;color:var(--muted);font:600 12.5px var(--font-body);padding:6px 14px;border-radius:7px;cursor:pointer}
.seg button.p{background:var(--good-soft);color:var(--good)} .seg button.a{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transition:width .3s}
.bar.good i{background:var(--good)} .bar.warn i{background:#E59A1A} .bar.bad i{background:var(--bad)}
.mr{display:grid;grid-template-columns:84px 1fr 62px;gap:12px;align-items:center;padding:7px 0}
.mr .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font:600 11.5px var(--font-body);color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line-2);font-variant-numeric:tabular-nums;vertical-align:middle}
tr:last-child td{border-bottom:0}
td .nm{display:flex;gap:10px;align-items:center;white-space:nowrap}
td input[type=number]{width:84px}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .tr{stroke:var(--line-2)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font:800 28px var(--font-head);line-height:1}
.ring .c span{font-size:12px;color:var(--muted)}
.note{background:var(--accent-soft);border-radius:11px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;justify-content:space-between;align-items:center}
.alert{background:var(--warn-soft);color:var(--warn);border-radius:11px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.nt{padding:14px 0;border-top:1px solid var(--line-2)}
.nt:first-child{border-top:0;padding-top:0}
.nt p{margin:6px 0 0}
.hw{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-2);cursor:pointer}
.hw:first-child{border-top:0;padding-top:0}
.hw input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
.hw .done{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}

/* login */
.auth{min-height:100vh;display:grid;grid-template-columns:1.05fr 1fr}
.auth .l{background:linear-gradient(160deg,#0F1B33 0%,#16306B 100%);color:#DCE5F8;padding:56px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth .l h2{font:800 34px var(--font-head);color:#fff;line-height:1.15;max-width:15em}
.auth .l p{color:#A9B8D8;max-width:30em}
.auth .ft{display:grid;gap:14px}
.auth .ft div{display:flex;gap:12px;align-items:flex-start}
.auth .ft .ic{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:none}
.auth .ft b{color:#fff;display:block;font-size:14px}
.auth .ft span{font-size:13px;color:#A9B8D8}
.auth .r{display:grid;place-items:center;padding:32px 20px}
.box{width:100%;max-width:400px}
.box h1{margin-bottom:4px}
.role{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:20px 0 4px}
.role button{display:flex;flex-direction:column;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:11px;padding:12px 6px;font:600 13px var(--font-body);cursor:pointer}
.role button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.err{color:var(--bad);font-size:13px;min-height:20px}
.demo{margin-top:20px;border:1px dashed var(--line);border-radius:11px;padding:12px 14px;font-size:13px;color:var(--muted)}
.demo button{border:0;background:none;color:var(--accent);font:600 13px var(--font-body);cursor:pointer;padding:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-size:13.5px;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast:empty{display:none}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:sticky;height:auto;flex-direction:row;align-items:center;gap:6px;padding:10px 12px;overflow-x:auto;z-index:10}
  .brand{padding:0 8px 0 0}.brand small,.brand b,.nav .cap{display:none}
  .nav{flex-direction:row;margin:0}.nav button{white-space:nowrap;padding:8px 12px}
  .me{margin:0 0 0 auto;border:0;padding:0}.me .t,.me .av{display:none}
  .main{padding:20px 16px 48px}
  .auth{grid-template-columns:1fr}.auth .l{display:none}
}
@media (max-width:480px){.mr{grid-template-columns:70px 1fr 50px}.search input{width:100%}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast" role="status"></div>

<script>
(function(){
var SUBJ=['Maths','Science','English','Hindi','Social'];
var KEY='school-portal-pro-v1';
function $(id){return document.getElementById(id)}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmt(d){var x=new Date(d+'T00:00:00');return isNaN(x)?'':x.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}
function hp(p){var x=5381,s='sp:'+p;for(var i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return String(x)}
function toast(t){var el=$('toast');el.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(function(){el.textContent=''},3200)}

var IC={
 home:'M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z',
 users:'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75',
 clip:'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11',
 book:'M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z',
 bell:'M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0',
 sliders:'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6',
 out:'M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9',
 chart:'M18 20V10M12 20V4M6 20v-6',
 award:'M12 15a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM8.21 13.89L7 23l5-3 5 3-1.21-9.12',
 plus:'M12 5v14M5 12h14',
 search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.35-4.35',
 alert:'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0zM12 9v4M12 17h.01',
 cal:'M3 4h18v18H3zM16 2v4M8 2v4M3 10h18',
 cap:'M22 10L12 5 2 10l10 5 10-5zM6 12v5c3 2 9 2 12 0v-5',
 user:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',
 down:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',
 up:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12',
 trash:'M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6'
};
function ic(n){return '<svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="'+IC[n]+'"/></svg>'}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function av(name,cls){var p=String(name).trim().split(/\s+/).filter(function(w){return !/^(Mr|Mrs|Ms|Dr)\.?$/i.test(w)});var t=((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();return '<span class="av '+(cls||'')+'" style="--h:'+hue(name)+'">'+esc(t)+'</span>'}

function seed(){
  var rows=[['Aarav Patel','8-A',1,[82,76,88,79,84],88],['Diya Shah','8-A',2,[91,94,89,85,90],90],['Kabir Desai','8-A',3,[48,41,55,60,52],70],
   ['Meera Joshi','8-A',4,[67,72,70,64,69],84],['Rohan Mehta','8-A',5,[35,38,42,40,33],66],['Anaya Gupta','8-B',1,[78,81,74,80,77],85],
   ['Vihaan Rao','8-B',2,[59,63,66,58,61],80],['Ishita Nair','8-B',3,[88,92,85,90,87],90],['Arjun Singh','8-B',4,[44,39,50,47,45],72],['Saanvi Iyer','8-B',5,[73,70,79,75,72],86]];
  return {
    principalPin:hp('1111'),
    teachers:[{id:'t1',name:'Mrs. Sharma',classes:['8-A'],pin:hp('2222')},{id:'t2',name:'Mr. Verma',classes:['8-B'],pin:hp('3333')}],
    students:rows.map(function(r,i){var m={};SUBJ.forEach(function(k,j){m[k]=r[3][j]});
      return {id:'s'+(i+1),name:r[0],cls:r[1],roll:r[2],present:r[4],total:92,today:null,todayDate:'',marks:m,pin:hp('1234'),done:{}}}),
    homework:[
      {id:'h1',cls:'8-A',subject:'Maths',title:'Exercise 7.2, questions 1 to 10',due:ymd(new Date(Date.now()+2*864e5))},
      {id:'h2',cls:'8-A',subject:'Science',title:'Draw and label the human digestive system',due:ymd(new Date(Date.now()+4*864e5))},
      {id:'h3',cls:'8-B',subject:'English',title:'Write a 150 word letter to the editor',due:ymd(new Date(Date.now()+3*864e5))},
      {id:'h4',cls:'8-B',subject:'Hindi',title:'Chapter 6 question answers',due:ymd(new Date(Date.now()+5*864e5))}],
    notices:[
      {id:'n1',to:'All',from:'Principal',text:'Half-yearly exam timetable is out. Exams begin on 1 December.',date:ymd(new Date(Date.now()-2*864e5))},
      {id:'n2',to:'8-A',from:'Class teacher 8-A',text:'Science project submission moved to Friday.',date:ymd(new Date(Date.now()-864e5))}],
    nid:100
  };
}
var D;try{D=JSON.parse(localStorage.getItem(KEY))}catch(e){D=null}
if(!D||!D.students)D=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){toast('Could not save in this browser.')}}
function newId(p){D.nid++;return p+D.nid}
var sess=null;try{sess=JSON.parse(sessionStorage.getItem('sp-pro-session'))}catch(e){}
var ui={lrole:'principal',page:'',tClass:'',tSubj:'Maths',q:'',pinMsg:'',fails:0,lock:0,err:''};

/* ---------- derived ---------- */
function tod(s){return s.todayDate===ymd()?(s.today===true?true:s.today===false?false:null):null}
function pct(s){var t=(s.total||0)+(tod(s)===null?0:1),p=(s.present||0)+(tod(s)===true?1:0);return t?Math.round(p/t*100):null}
function avg(s){var v=SUBJ.map(function(k){return s.marks&&s.marks[k]}).filter(function(x){return typeof x==='number'});return v.length?Math.round(v.reduce(function(a,b){return a+b},0)/v.length):null}
function mean(a){a=a.filter(function(x){return x!==null&&x!==undefined});return a.length?Math.round(a.reduce(function(x,y){return x+y},0)/a.length):null}
function sub(s,k){var v=s.marks&&s.marks[k];return typeof v==='number'?v:null}
function tone(v,lo,mid){return v===null?'':v<lo?'bad':v<mid?'warn':'good'}
function grade(v){return v===null?'-':v>=90?'A+':v>=80?'A':v>=70?'B+':v>=60?'B':v>=50?'C':v>=40?'D':'F'}
function show(v,suf){return v===null||v===undefined?'-':v+(suf||'')}
function bar(v,cls){return '<div class="bar '+(cls||'')+'"><i style="width:'+Math.max(0,Math.min(100,v||0))+'%"></i></div>'}
function opts(arr,sel){return arr.map(function(a){var v=Array.isArray(a)?a[0]:a,l=Array.isArray(a)?a[1]:a;return '<option value="'+esc(v)+'"'+(String(v)===String(sel)?' selected':'')+'>'+esc(l)+'</option>'}).join('')}
function classes(){var o={};D.students.forEach(function(s){o[s.cls]=1});D.teachers.forEach(function(t){t.classes.forEach(function(c){o[c]=1})});return Object.keys(o).sort()}
function byClass(c){return D.students.filter(function(s){return s.cls===c}).sort(function(a,b){return a.roll-b.roll})}
function stu(id){return D.students.filter(function(s){return s.id===id})[0]}
function tch(id){return D.teachers.filter(function(t){return t.id===id})[0]}
function newPin(){return String(Math.floor(1000+Math.random()*9000))}
function attPill(s){var x=tod(s);return x===true?'<span class="pill good">Present</span>':x===false?'<span class="pill bad">Absent</span>':'<span class="pill n">Not marked</span>'}
function ring(v,label){var c=2*Math.PI*54,p=v===null?0:v,t=tone(v,75,90),col=t==='bad'?'var(--bad)':t==='warn'?'#E59A1A':'var(--good)';
  return '<div class="ring"><svg viewBox="0 0 132 132"><circle class="tr" cx="66" cy="66" r="54"/><circle cx="66" cy="66" r="54" stroke="'+col+'" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-p/100)).toFixed(1)+'"/></svg><div class="c"><b>'+show(v,'%')+'</b><span>'+esc(label)+'</span></div></div>'}
function stat(icn,tn,val,label){return '<div class="stat"><div class="ic '+tn+'">'+ic(icn)+'</div><div><b>'+val+'</b><span>'+esc(label)+'</span></div></div>'}
function head(t,s,right){return '<div class="head"><div><h1>'+esc(t)+'</h1>'+(s?'<p>'+esc(s)+'</p>':'')+'</div>'+(right||'')+'</div>'}
function sortedNotices(f){return D.notices.filter(f||function(){return true}).slice().sort(function(a,b){return (b.date+b.id).localeCompare(a.date+a.id)})}
function noticeList(list){return list.length?list.map(function(n){return '<div class="nt"><div class="row"><span class="pill n">'+esc(n.from)+'</span><span class="pill">'+(n.to==='All'?'Whole school':'Class '+esc(n.to))+'</span><span class="muted sm">'+fmt(n.date)+'</span></div><p>'+esc(n.text)+'</p></div>'}).join(''):'<div class="empty">No notices yet.</div>'}
function dueChip(h,done){var t=ymd();if(done)return '<span class="pill good">Done</span>';if(h.due<t)return '<span class="pill bad">Overdue</span>';if(h.due===t)return '<span class="pill warn">Due today</span>';return '<span class="pill n">Due '+fmt(h.due)+'</span>'}

/* ---------- navigation ---------- */
function navFor(role){
  if(role==='principal')return [['overview','Overview','home'],['students','Students','users'],['teachers','Teachers','cap'],['notices','Notices','bell'],['settings','Settings and backup','sliders']];
  if(role==='teacher')return [['attendance','Attendance','clip'],['marks','Marks','award'],['homework','Homework','book'],['notices','Notices','bell']];
  return [['overview','My overview','home'],['marks','My marks','award'],['homework','Homework','book'],['notices','Notices','bell']];
}
function shell(content,name,roleLabel){
  var nav=navFor(sess.role);if(!nav.some(function(n){return n[0]===ui.page}))ui.page=nav[0][0];
  return '<div class="app"><aside class="side"><div class="brand"><div class="logo">'+ic('cap')+'</div><div><b>School Portal</b><small>Sunrise Public School</small></div></div>'+
    '<nav class="nav" aria-label="Main"><div class="cap">'+esc(roleLabel)+'</div>'+nav.map(function(n){return '<button data-page="'+n[0]+'"'+(ui.page===n[0]?' aria-current="page"':'')+'>'+ic(n[2])+n[1]+'</button>'}).join('')+'</nav>'+
    '<div class="me">'+av(name,'sm')+'<div class="t"><b>'+esc(name)+'</b><small>'+esc(roleLabel)+'</small></div><button id="logout" title="Sign out" aria-label="Sign out">'+ic('out')+'</button></div></aside><main class="main">'+content+'</main></div>';
}

/* ---------- teacher pages ---------- */
function teacherCtx(t){
  var cl=t.classes.filter(function(c){return classes().indexOf(c)>=0});
  if(cl.indexOf(ui.tClass)<0)ui.tClass=cl[0]||'';
  return cl;
}
function classPicker(cl){return cl.length>1?'<label class="f" style="min-width:140px">Class<select id="tClass">'+opts(cl,ui.tClass)+'</select></label>':'<span class="pill">Class '+esc(ui.tClass)+'</span>'}
function tAttendance(t){
  var cl=teacherCtx(t);if(!cl.length)return head('Attendance')+'<div class="card empty">No class assigned yet. Ask the principal to assign you one.</div>';
  var list=byClass(ui.tClass),p=list.filter(function(s){return tod(s)===true}).length,a=list.filter(function(s){return tod(s)===false}).length;
  var h=head('Attendance','Mark who is in class today, '+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'}),classPicker(cl));
  h+='<div class="stats">'+stat('users','',list.length,'Students')+stat('clip','good',p,'Present today')+stat('alert',a?'bad':'',a,'Absent today')+stat('cal','warn',list.length-p-a,'Not marked yet')+'</div>';
  h+='<div class="card"><div class="ch"><h2>Class '+esc(ui.tClass)+'</h2><button class="btn" data-a="allp">'+ic('clip')+'Mark all present</button></div>';
  if(!list.length)h+='<div class="empty">No students in this class.</div>';
  list.forEach(function(s){var x=tod(s);
    h+='<div class="li">'+av(s.name)+'<div class="w"><b>'+esc(s.name)+'</b><span class="muted sm">Roll '+esc(s.roll)+' &middot; overall '+show(pct(s),'%')+'</span></div>'+
      '<div class="seg"><button data-a="att" data-k="'+s.id+'" data-v="1" class="'+(x===true?'p':'')+'" aria-pressed="'+(x===true)+'">Present</button><button data-a="att" data-k="'+s.id+'" data-v="0" class="'+(x===false?'a':'')+'" aria-pressed="'+(x===false)+'">Absent</button></div></div>'});
  return h+'</div>';
}
function tMarks(t){
  var cl=teacherCtx(t);if(!cl.length)return head('Marks')+'<div class="card empty">No class assigned yet.</div>';
  var list=byClass(ui.tClass),ca=mean(list.map(function(s){return sub(s,ui.tSubj)}));
  var h=head('Marks','Enter marks out of 100. Changes save as you type them in.',classPicker(cl));
  h+='<div class="card"><div class="ch"><div class="chips" role="group" aria-label="Subject">'+SUBJ.map(function(k){return '<button data-subj="'+k+'" aria-pressed="'+(ui.tSubj===k)+'">'+k+'</button>'}).join('')+'</div><span class="pill">Class average '+show(ca)+'</span></div>'+
    '<div class="tw"><table><thead><tr><th>Student</th><th>Marks</th><th>Grade</th><th>Overall average</th></tr></thead><tbody>';
  list.forEach(function(s){var v=sub(s,ui.tSubj);h+='<tr><td><div class="nm">'+av(s.name,'sm')+esc(s.name)+'</div></td><td><input type="number" min="0" max="100" data-a="mark" data-k="'+s.id+'" value="'+(v===null?'':v)+'" aria-label="'+esc(ui.tSubj)+' marks for '+esc(s.name)+'"></td><td><span class="pill '+tone(v,40,60)+'">'+grade(v)+'</span></td><td>'+show(avg(s))+'</td></tr>'});
  return h+'</tbody></table></div></div>';
}
function tHomework(t){
  var cl=teacherCtx(t);if(!cl.length)return head('Homework')+'<div class="card empty">No class assigned yet.</div>';
  var list=byClass(ui.tClass),as=D.homework.filter(function(a){return a.cls===ui.tClass}).sort(function(a,b){return a.due.localeCompare(b.due)});
  var h=head('Homework','Set tasks and see who has finished.',classPicker(cl))+'<div class="grid g2"><div class="card"><div class="ch"><h2>Set for class '+esc(ui.tClass)+'</h2></div><form class="form flat" id="fHw"><div class="row"><label class="f">Subject<select id="hwS">'+opts(SUBJ)+'</select></label><label class="f">Due date<input type="date" id="hwD" required value="'+ymd()+'"></label></div>'+
    '<label class="f">Task<input id="hwT" required maxlength="120" placeholder="What should students do?"></label><div><button class="btn pri" type="submit">'+ic('plus')+'Set homework</button></div></form></div>'+
    '<div class="card"><div class="ch"><h2>Current homework</h2></div>';
  if(!as.length)h+='<div class="empty">No homework set.</div>';
  as.forEach(function(a){var n=list.filter(function(s){return s.done&&s.done[a.id]}).length;
    h+='<div class="li"><div class="w"><b>'+esc(a.title)+'</b><span class="muted sm">'+esc(a.subject)+' &middot; due '+fmt(a.due)+'</span><div style="margin-top:6px">'+bar(list.length?n/list.length*100:0,'good')+'</div></div><span class="pill n">'+n+'/'+list.length+' done</span><button class="btn sm danger" data-a="hwdel" data-k="'+a.id+'" aria-label="Remove homework">'+ic('trash')+'</button></div>'});
  return h+'</div></div>';
}
function tNotices(){
  var h=head('Notices','Send a message to your class.',classPicker(teacherCtx(tch(sess.id))))+'<div class="grid g2"><div class="card"><div class="ch"><h2>New notice for class '+esc(ui.tClass)+'</h2></div><form class="form flat" id="fNt"><label class="f">Message<textarea id="ntT" required maxlength="240" placeholder="Short notice for students"></textarea></label><div><button class="btn pri" type="submit">Send notice</button></div></form></div>'+
    '<div class="card"><div class="ch"><h2>Recent</h2></div>'+noticeList(sortedNotices(function(n){return n.to==='All'||n.to===ui.tClass}).slice(0,6))+'</div></div>';
  return h;
}

/* ---------- student pages ---------- */
function sOverview(s){
  var p=pct(s),a=avg(s),pend=D.homework.filter(function(h){return h.cls===s.cls&&!(s.done&&s.done[h.id])}).sort(function(x,y){return x.due.localeCompare(y.due)});
  var h='<div class="card" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap;margin-bottom:18px">'+av(s.name,'lg')+'<div style="flex:1;min-width:180px"><h1 style="font-size:22px">'+esc(s.name)+'</h1><p class="muted" style="margin:4px 0 8px">Class '+esc(s.cls)+' &middot; Roll no. '+esc(s.roll)+'</p>'+attPill(s)+'</div></div>';
  if(p!==null&&p<75)h+='<div class="alert" style="margin-bottom:18px">'+ic('alert')+'<div><b>Attendance is below 75%.</b> Speak to your class teacher so you do not miss exam eligibility.</div></div>';
  h+='<div class="grid g2"><div class="card"><div class="ch"><h2>Attendance</h2></div><div class="row" style="gap:22px">'+ring(p,'attendance')+'<div><div class="sm muted">Days present</div><b style="font:800 22px var(--font-head)">'+(s.present+(tod(s)===true?1:0))+' / '+(s.total+(tod(s)===null?0:1))+'</b></div></div></div>'+
    '<div class="card"><div class="ch"><h2>Performance</h2><span class="pill '+tone(a,40,60)+'">Average '+show(a)+' &middot; '+grade(a)+'</span></div>';
  SUBJ.forEach(function(k){var v=sub(s,k);h+='<div class="mr"><span>'+k+'</span>'+bar(v||0,tone(v,40,60))+'<span class="n">'+show(v)+'</span></div>'});
  h+='</div><div class="card"><div class="ch"><h2>Homework to do</h2><button class="btn sm" data-page="homework">View all</button></div>';
  if(!pend.length)h+='<div class="empty">All caught up.</div>';
  pend.slice(0,4).forEach(function(x){h+='<div class="li"><div class="w"><b>'+esc(x.title)+'</b><span class="muted sm">'+esc(x.subject)+'</span></div>'+dueChip(x,false)+'</div>'});
  h+='</div><div class="card"><div class="ch"><h2>Latest notices</h2><button class="btn sm" data-page="notices">View all</button></div>'+noticeList(sortedNotices(function(n){return n.to==='All'||n.to===s.cls}).slice(0,2))+'</div></div>';
  return h;
}
function sMarks(s){
  var a=avg(s),h=head('My marks','Subject-wise results out of 100.')+'<div class="stats">'+stat('award',tone(a,40,60),show(a),'Average marks')+stat('chart','','Grade '+grade(a),'Overall grade')+'</div><div class="card"><div class="tw"><table><thead><tr><th>Subject</th><th>Marks</th><th style="width:40%">Progress</th><th>Grade</th></tr></thead><tbody>';
  SUBJ.forEach(function(k){var v=sub(s,k);h+='<tr><td><b>'+k+'</b></td><td>'+show(v)+'</td><td>'+bar(v||0,tone(v,40,60))+'</td><td><span class="pill '+tone(v,40,60)+'">'+grade(v)+'</span></td></tr>'});
  return h+'</tbody></table></div></div>';
}
function sHomework(s){
  var as=D.homework.filter(function(x){return x.cls===s.cls}).sort(function(a,b){return a.due.localeCompare(b.due)}),n=as.filter(function(x){return s.done&&s.done[x.id]}).length;
  var h=head('Homework','Tick a task when you finish it.','<span class="pill">'+n+' of '+as.length+' done</span>')+'<div class="card">';
  if(!as.length)h+='<div class="empty">No homework right now.</div>';
  as.forEach(function(x){var dn=!!(s.done&&s.done[x.id]);h+='<label class="hw"><input type="checkbox" data-a="hw" data-k="'+x.id+'"'+(dn?' checked':'')+'><span style="flex:1"><span class="'+(dn?'done':'')+'"><b>'+esc(x.title)+'</b></span><br><span class="muted sm">'+esc(x.subject)+'</span></span>'+dueChip(x,dn)+'</label>'});
  return h+'</div>';
}
function sNotices(s){return head('Notices','Messages from your teachers and the principal.')+'<div class="card">'+noticeList(sortedNotices(function(n){return n.to==='All'||n.to===s.cls}))+'</div>'}

/* ---------- principal pages ---------- */
function pOverview(){
  var all=D.students,marked=all.filter(function(s){return tod(s)!==null}),pres=marked.filter(function(s){return tod(s)===true}).length,
      risk=all.filter(function(s){var p=pct(s),a=avg(s);return (p!==null&&p<75)||(a!==null&&a<50)});
  var h=head('Overview','School snapshot for '+new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long',year:'numeric'}));
  if(ui.pinMsg)h+='<div class="note" style="margin-bottom:16px"><span>'+esc(ui.pinMsg)+'</span><button class="btn sm" data-a="clearmsg">Dismiss</button></div>';
  h+='<div class="stats">'+stat('users','',all.length,'Students enrolled')+stat('clip','good',marked.length?Math.round(pres/marked.length*100)+'%':'-','Present today ('+marked.length+' marked)')+stat('award','',show(mean(all.map(avg))),'School average marks')+stat('alert',risk.length?'bad':'good',risk.length,'Need attention')+'</div><div class="grid g2">';
  h+='<div class="card"><div class="ch"><h2>Classes</h2></div><div class="tw"><table><thead><tr><th>Class</th><th>Today</th><th>Attendance</th><th>Avg marks</th></tr></thead><tbody>';
  classes().forEach(function(c){var l=byClass(c),m=l.filter(function(s){return tod(s)!==null}),pp=l.filter(function(s){return tod(s)===true}).length,ap=mean(l.map(pct));
    h+='<tr><td><b>'+esc(c)+'</b> <span class="muted sm">'+l.length+' students</span></td><td>'+(m.length?pp+'/'+l.length+' present':'<span class="muted">Not marked</span>')+'</td><td><span class="pill '+tone(ap,75,90)+'">'+show(ap,'%')+'</span></td><td>'+show(mean(l.map(avg)))+'</td></tr>'});
  h+='</tbody></table></div></div><div class="card"><div class="ch"><h2>Subject averages</h2></div>';
  SUBJ.forEach(function(k){var v=mean(all.map(function(s){return sub(s,k)}));h+='<div class="mr"><span>'+k+'</span>'+bar(v||0,tone(v,50,65))+'<span class="n">'+show(v)+'</span></div>'});
  h+='</div><div class="card"><div class="ch"><div><h2>Needs attention</h2><p>Attendance under 75% or average under 50.</p></div></div>';
  if(!risk.length)h+='<div class="empty">No students flagged.</div>';
  risk.forEach(function(s){var p=pct(s),a=avg(s);h+='<div class="li">'+av(s.name)+'<div class="w"><b>'+esc(s.name)+'</b><span class="muted sm">Class '+esc(s.cls)+'</span></div><span class="pill '+(p!==null&&p<75?'bad':'good')+'">'+show(p,'%')+' attendance</span><span class="pill '+(a!==null&&a<50?'bad':'good')+'">Avg '+show(a)+'</span></div>'});
  h+='</div><div class="card"><div class="ch"><h2>Homework set by teachers</h2></div>';
  if(!D.homework.length)h+='<div class="empty">No homework set.</div>';
  D.homework.slice().sort(function(a,b){return a.due.localeCompare(b.due)}).forEach(function(x){var l=byClass(x.cls),n=l.filter(function(s){return s.done&&s.done[x.id]}).length;
    h+='<div class="li"><div class="w"><b>'+esc(x.title)+'</b><span class="muted sm">Class '+esc(x.cls)+' &middot; '+esc(x.subject)+' &middot; due '+fmt(x.due)+'</span></div><span class="pill n">'+n+'/'+l.length+'</span></div>'});
  return h+'</div></div>';
}

  var h='<div class="tw"><table><thead><tr><th>Student</th><th>Class</th><th>Attendance</th><th>Average</th><th></th></tr></thead><tbody>';

    '<td style="text-align:right;white-space:nowrap"><button class="btn sm" data-a="spin" data-k="'+s.id+'">Reset PIN</button> <button class="btn sm danger" data-a="sdel" data-k="'+s.id+'" aria-label="Remove '+esc(s.name)+'">'+ic('trash')+'</button></td></tr>'});
  return h+'</tbody></table></div>';
}
function pStudents(){

function pTeachers(){
  var h=head('Teachers','Accounts and class assignments.');
  if(ui.pinMsg)h+='<div class="note" style="margin-bottom:16px"><span>'+esc(ui.pinMsg)+'</span><button class="btn sm" data-a="clearmsg">Dismiss</button></div>';
  h+='<div class="stack"><div class="grid g3">';
  D.teachers.forEach(function(t){h+='<div class="card"><div class="row" style="flex-wrap:nowrap;margin-bottom:12px">'+av(t.name)+'<div style="min-width:0"><b>'+esc(t.name)+'</b><div class="chips" style="margin-top:4px">'+(t.classes.length?t.classes.map(function(c){return '<span class="pill">Class '+esc(c)+'</span>'}).join(''):'<span class="pill n">No class</span>')+'</div></div></div><div class="row"><button class="btn sm" data-a="tpin" data-k="'+t.id+'">Reset PIN</button><button class="btn sm danger" data-a="tdel" data-k="'+t.id+'">Remove</button></div></div>'});
  if(!D.teachers.length)h+='<div class="card empty">No teachers yet.</div>';
  h+='</div><div class="card"><div class="ch"><h2>Add a teacher</h2></div><form class="form flat" id="fTc"><div class="row"><label class="f">Name<input id="tcN" required maxlength="50"></label><label class="f">Classes<input id="tcC" required placeholder="8-A, 8-B" size="12"></label><label class="f">PIN<input id="tcP" required maxlength="12" inputmode="numeric" size="6"></label></div><div><button class="btn pri" type="submit">'+ic('plus')+'Add teacher</button></div></form></div></div>';
  return h;
}
function pNotices(){
  return head('Notices','Announcements for the whole school or one class.')+'<div class="grid g2"><div class="card"><div class="ch"><h2>New notice</h2></div><form class="form flat" id="fPn"><label class="f">Send to<select id="pnTo">'+opts([['All','Whole school']].concat(classes().map(function(c){return [c,'Class '+c]})))+'</select></label><label class="f">Message<textarea id="pnT" required maxlength="240" placeholder="Announcement for students and parents"></textarea></label><div><button class="btn pri" type="submit">Publish notice</button></div></form></div>'+
    '<div class="card"><div class="ch"><h2>All notices</h2></div>'+noticeList(sortedNotices().slice(0,8))+'</div></div>';
}
function pSettings(){
  return head('Settings and backup','Your account and your data.')+'<div class="grid g2"><div class="card"><div class="ch"><h2>Change my PIN</h2></div><form class="form flat" id="fPp"><label class="f">New principal PIN<input id="ppN" required maxlength="12" inputmode="numeric" type="password"></label><div><button class="btn pri" type="submit">Update PIN</button></div></form></div>'+
    '<div class="card"><div class="ch"><div><h2>Backup</h2><p>Data is stored in this browser only. Download a backup regularly and restore it on another computer.</p></div></div><div class="row"><button class="btn" data-a="backup">'+ic('down')+'Download backup</button><label class="btn" style="cursor:pointer">'+ic('up')+'Restore backup<input type="file" id="restore" accept=".json,application/json" hidden></label><button class="btn danger" data-a="reset">Reset to demo data</button></div></div></div>';
}

/* ---------- render ---------- */
function page(){
  if(sess.role==='principal')return {name:'Principal',label:'Principal',html:({overview:pOverview,students:pStudents,teachers:pTeachers,notices:pNotices,settings:pSettings}[ui.page]||pOverview)()};
  if(sess.role==='teacher'){var t=tch(sess.id);if(!t)return null;return {name:t.name,label:'Teacher',html:({attendance:tAttendance,marks:tMarks,homework:tHomework,notices:tNotices}[ui.page]||tAttendance)(t)}}
  var s=stu(sess.id);if(!s)return null;return {name:s.name,label:'Student',html:({overview:sOverview,marks:sMarks,homework:sHomework,notices:sNotices}[ui.page]||sOverview)(s)};
}
function render(){
  var root=$('root');
  if(!sess){root.innerHTML=loginHTML();return}
  var nav=navFor(sess.role);if(!nav.some(function(n){return n[0]===ui.page}))ui.page=nav[0][0];
  var p=page();if(!p){logout();return}
  root.innerHTML=shell(p.html,p.name,p.label);
}
function logout(){sess=null;ui.err='';ui.page='';ui.pinMsg='';try{sessionStorage.removeItem('sp-pro-session')}catch(e){}render()}
function guard(role){return sess&&(sess.role===role||sess.role==='principal')}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  if(b.id==='logout'){logout();return}
  if(b.dataset.lrole){ui.lrole=b.dataset.lrole;ui.err='';render();return}
  if(b.dataset.a==='fill'){$('lPin').value=b.dataset.pin;$('lPin').focus();return}
  if(!sess)return;
  if(b.dataset.page){ui.page=b.dataset.page;ui.pinMsg=ui.page==='students'||ui.page==='teachers'||ui.page==='overview'?ui.pinMsg:'';render();window.scrollTo(0,0);return}
  if(b.dataset.subj){ui.tSubj=b.dataset.subj;render();return}
  var a=b.dataset.a;if(!a)return;
  if(a==='att'&&guard('teacher')){var s=stu(b.dataset.k);s.today=b.dataset.v==='1';s.todayDate=ymd();save();render()}
  else if(a==='allp'&&guard('teacher')){byClass(ui.tClass).forEach(function(s){s.today=true;s.todayDate=ymd()});save();render();toast('Everyone marked present')}
  else if(a==='hwdel'&&guard('teacher')){D.homework=D.homework.filter(function(h){return h.id!==b.dataset.k});save();render()}
  else if(sess.role==='principal'){
    if(a==='clearmsg'){ui.pinMsg='';render()}
    else if(a==='spin'){var s2=stu(b.dataset.k),p=newPin();s2.pin=hp(p);save();ui.pinMsg='New PIN for '+s2.name+': '+p+'. Share it with them privately.';render()}
    else if(a==='tpin'){var t2=tch(b.dataset.k),p2=newPin();t2.pin=hp(p2);save();ui.pinMsg='New PIN for '+t2.name+': '+p2+'. Share it with them privately.';render()}
    else if(a==='sdel'){if(b.dataset.sure){D.students=D.students.filter(function(s){return s.id!==b.dataset.k});save();render()}else{b.dataset.sure='1';b.textContent='Confirm'}}
    else if(a==='tdel'){if(b.dataset.sure){D.teachers=D.teachers.filter(function(t){return t.id!==b.dataset.k});save();render()}else{b.dataset.sure='1';b.textContent='Confirm'}}
    else if(a==='backup'){var blob=new Blob([JSON.stringify(D)],{type:'application/json'}),l=document.createElement('a');l.href=URL.createObjectURL(blob);l.download='school-portal-backup-'+ymd()+'.json';document.body.appendChild(l);l.click();l.remove()}
    else if(a==='reset'){if(b.dataset.sure){D=seed();save();ui.pinMsg='';render();toast('Demo data restored')}else{b.dataset.sure='1';b.textContent='Click again to confirm'}}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;if(!sess)return;
  if(t.id==='tClass'){ui.tClass=t.value;render()}
  else if(t.dataset.a==='mark'&&guard('teacher')){var s=stu(t.dataset.k),raw=t.value.trim();s.marks[ui.tSubj]=raw===''?null:Math.max(0,Math.min(100,Math.round(+raw)));save();render()}
  else if(t.dataset.a==='hw'&&sess.role==='student'){var st=stu(sess.id);st.done=st.done||{};if(t.checked)st.done[t.dataset.k]=true;else delete st.done[t.dataset.k];save();render()}
  else if(t.id==='restore'&&sess.role==='principal'){
    var f=t.files[0];if(!f)return;var r=new FileReader();
    r.onload=function(){try{var x=JSON.parse(r.result);if(!x.students||!x.teachers||!x.principalPin)throw 0;D=x;save();render();toast('Backup restored')}catch(err){toast('That file is not a School Portal backup.')}};
    r.readAsText(f)}
});
document.addEventListener('input',function(e){
  if(e.target.id==='sq'){ui.q=e.target.value;$('stuTable').innerHTML=stuRows()}
});
document.addEventListener('submit',function(e){
  e.preventDefault();var id=e.target.id;
  if(id==='fLogin'){
    var now=Date.now();if(now<ui.lock){ui.err='Too many wrong PINs. Wait '+Math.ceil((ui.lock-now)/1000)+' seconds.';render();return}
    var pin=hp($('lPin').value),ok=false,sid=$('lId')?$('lId').value:null;
    if(ui.lrole==='principal')ok=pin===D.principalPin;
    else if(ui.lrole==='teacher'){var t=tch(sid);ok=!!t&&t.pin===pin}
    else{var s=stu(sid);ok=!!s&&s.pin===pin}
    if(ok){ui.fails=0;ui.err='';ui.page='';sess={role:ui.lrole,id:sid};try{sessionStorage.setItem('sp-pro-session',JSON.stringify(sess))}catch(x){}render()}
    else{ui.fails++;ui.err='That PIN is not correct.';if(ui.fails>=5){ui.lock=Date.now()+30000;ui.fails=0;ui.err='Too many wrong PINs. Wait 30 seconds.'}render()}
    return;
  }
  if(!sess)return;
  if(id==='fHw'&&guard('teacher'))D.homework.push({id:newId('h'),cls:ui.tClass,subject:$('hwS').value,title:$('hwT').value.trim(),due:$('hwD').value});
  else if(id==='fNt'&&guard('teacher'))D.notices.push({id:newId('n'),to:ui.tClass,from:'Class teacher '+ui.tClass,text:$('ntT').value.trim(),date:ymd()});
  else if(sess.role==='principal'&&id==='fPn')D.notices.push({id:newId('n'),to:$('pnTo').value,from:'Principal',text:$('pnT').value.trim(),date:ymd()});
  else if(sess.role==='principal'&&id==='fSt')D.students.push({id:newId('s'),name:$('stN').value.trim(),cls:$('stC').value.trim(),roll:+$('stR').value,present:0,total:0,today:null,todayDate:'',marks:{},pin:hp($('stP').value),done:{}});
  else if(sess.role==='principal'&&id==='fTc')D.teachers.push({id:newId('t'),name:$('tcN').value.trim(),classes:$('tcC').value.split(',').map(function(x){return x.trim()}).filter(Boolean),pin:hp($('tcP').value)});
  else if(sess.role==='principal'&&id==='fPp'){D.principalPin=hp($('ppN').value);toast('PIN updated')}
  else return;
  save();render();if(id!=='fPp')toast('Saved');
});
render();
})();
</script>
</body>
</html>
